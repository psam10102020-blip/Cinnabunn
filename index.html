<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cinniminis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f6efe7;
      --accent: #f3d1a9;
      --text: #2b2219;
      --white: #ffffff;
      --shadow: 0 16px 40px rgba(0,0,0,0.12);
      --radius-lg: 22px;
      --transition-fast: 220ms ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Layout shell */
    .shell {
      width: min(1120px, 100vw - 40px);
      height: min(680px, 100vh - 40px);
      background: var(--white);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 26px 32px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      z-index: 2;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff7f0, #f0c9a0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 20px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    nav button {
      appearance: none;
      border: none;
      background: transparent;
      color: #8c7763;
      padding: 6px 0;
      cursor: pointer;
      position: relative;
      transition: color var(--transition-fast);
    }

    nav button::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: #2b2219;
      transition: width var(--transition-fast);
    }

    nav button.active {
      color: #2b2219;
    }

    nav button.active::after {
      width: 100%;
    }

    .cta-strip {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
    }

    .cta-strip span {
      color: #8c7763;
    }

    .cta-strip button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: #2b2219;
      color: #fff;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .cta-strip button:hover {
      background: #4a3625;
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.22);
    }

    /* Main content area */
    .content-wrap {
      flex: 1;
      display: flex;
      margin-top: 26px;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: linear-gradient(135deg, #fdf4ea, #f8e1c7);
    }

    .page {
      position: absolute;
      inset: 0;
      padding: 26px 26px 26px 26px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 24px;
      opacity: 0;
      transform: translateX(40px) translateY(10px);
      pointer-events: none;
      transition: opacity 340ms ease-out, transform 340ms ease-out;
    }

    .page.active {
      opacity: 1;
      transform: translateX(0) translateY(0);
      pointer-events: auto;
    }

    /* Typography */
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 11px;
      color: #a78c72;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 40px;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .lead {
      font-size: 14px;
      line-height: 1.6;
      color: #6b5745;
      max-width: 420px;
      margin-bottom: 24px;
    }

    .meta-row {
      display: flex;
      gap: 28px;
      font-size: 12px;
      color: #6b5745;
    }

    .meta-label {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      color: #a78c72;
      margin-bottom: 4px;
    }

    /* Home page specials */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
